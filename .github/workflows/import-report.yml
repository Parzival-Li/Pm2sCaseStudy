name: Import public case study snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack the public report snapshot
        run: |
          cat public-site-*.part > /tmp/pm2s-report.tar.gz
          echo "29330b565c5ec37542c64583affc63bc130a57d141f91363082a35dcb19b7902  /tmp/pm2s-report.tar.gz" | sha256sum --check -
          tar -xzf /tmp/pm2s-report.tar.gz -C .
          python3 tools/validate_site.py
      - name: Commit the public static website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm public-site-*.part
          git add docs README.md .gitignore tools/validate_site.py
          git commit -m "Publish English case study with public excerpt audio"
          git push origin HEAD:main
